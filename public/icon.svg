<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>
    <linearGradient id="frost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect width="510" height="510" x="1" y="1" rx="103" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Subtle specular ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Gym Barbell & Pulse Icon in Monochrome -->
  <g transform="translate(256, 256)">
    <!-- Barbell center bar -->
    <rect x="-140" y="-12" width="280" height="24" rx="6" fill="url(#metal)"/>
    
    <!-- Grip knurling markings -->
    <line x1="-70" y1="-12" x2="-70" y2="12" stroke="#27272a" stroke-width="3"/>
    <line x1="-50" y1="-12" x2="-50" y2="12" stroke="#27272a" stroke-width="3"/>
    <line x1="50" y1="-12" x2="50" y2="12" stroke="#27272a" stroke-width="3"/>
    <line x1="70" y1="-12" x2="70" y2="12" stroke="#27272a" stroke-width="3"/>

    <!-- Left Plates -->
    <rect x="-165" y="-60" width="22" height="120" rx="8" fill="#ffffff" filter="url(#glow)"/>
    <rect x="-192" y="-45" width="20" height="90" rx="6" fill="#71717a"/>
    <rect x="-210" y="-30" width="14" height="60" rx="4" fill="#3f3f46"/>

    <!-- Right Plates -->
    <rect x="143" y="-60" width="22" height="120" rx="8" fill="#ffffff" filter="url(#glow)"/>
    <rect x="172" y="-45" width="20" height="90" rx="6" fill="#71717a"/>
    <rect x="196" y="-30" width="14" height="60" rx="4" fill="#3f3f46"/>

    <!-- Dynamic Heartbeat / Energy Pulse intersecting center -->
    <path d="M -110 0 L -45 0 L -25 -48 L 0 54 L 25 -32 L 45 0 L 110 0" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- Core sparks -->
    <circle cx="0" cy="54" r="5" fill="#ffffff"/>
    <circle cx="-25" cy="-48" r="5" fill="#ffffff"/>
  </g>
</svg>
